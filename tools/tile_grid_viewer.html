  <canvas id="grid" width="640" height="576"></canvas>
</div>
<div id="info">
  Hover over a tile to see its <span class="highlight">(col, row)</span> coordinates.
  <span id="hover-coord">—</span>
</div>
<h2 style="margin-top:20px; font-size:16px;">Tile Mappings</h2>
<div id="mapping"></div>
<script>
const TILE_SIZE = 32, COLS = 20, ROWS = 18;
const img = document.getElementById('tileset');
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('wrapper');
const hoverCoord = document.getElementById('hover-coord');

const MAPPING = {
  grass:    { label: 'Grass',    tiles: [[2,0],[2,1],[0,2],[1,2]], color: '#4caf50' },
  path:     { label: 'Path',     tiles: [[9,0],[10,0],[9,1],[10,1]], color: '#90a4ae' },
  untilled: { label: 'Untilled', tiles: [[3,2],[4,2],[5,3]], color: '#8d6e63' },
  tilled:   { label: 'Tilled',   tiles: [[3,3],[4,3],[1,3]], color: '#a1887f' },
  watered:  { label: 'Watered',  tiles: [[4,3],[5,3],[3,2]], color: '#6d4c41' },
};
const MAP_COLORS = {};
for (const [key, m] of Object.entries(MAPPING))
  for (const [c, r] of m.tiles)
    MAP_COLORS[c+','+r] = { color: m.color, label: m.label, key };

function drawGrid(hc, hr) {
  ctx.clearRect(0, 0, 640, 576);
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      ctx.fillRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);

  for (const [coord, m] of Object.entries(MAP_COLORS)) {
    const [c, r] = coord.split(',').map(Number);
    ctx.fillStyle = (m.color+'99');  // 60% alpha via hex
    ctx.fillRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= 640; x += TILE_SIZE) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,576); ctx.stroke(); }
  for (let y = 0; y <= 576; y += TILE_SIZE) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(640,y); ctx.stroke(); }

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  for (let c = 0; c < COLS; c++) ctx.fillText(c, c*TILE_SIZE+TILE_SIZE/2, 10);
  ctx.textAlign = 'right';
  for (let r = 0; r < ROWS; r++) ctx.fillText(r, 14, r*TILE_SIZE+TILE_SIZE/2+4);

  if (hc >= 0 && hr >= 0) {
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.strokeRect(hc*TILE_SIZE, hr*TILE_SIZE, TILE_SIZE, TILE_SIZE);
  }
}

wrapper.addEventListener('mousemove', function(e) {
  var rect = wrapper.getBoundingClientRect();
  var tx = (e.clientX - rect.left) * (640 / rect.width);
  var ty = (e.clientY - rect.top) * (576 / rect.height);
  if (tx < 0 || tx >= 640 || ty < 0 || ty >= 576) { drawGrid(-1,-1); hoverCoord.textContent = '—'; return; }
  var col = Math.floor(tx / TILE_SIZE), row = Math.floor(ty / TILE_SIZE);
  drawGrid(col, row);
  var me = MAP_COLORS[col+','+row];
  hoverCoord.innerHTML = me
    ? 'Tile <span class="coord">('+col+', '+row+')</span> → <span style="color:'+me.color+'">■</span> '+me.label
    : 'Tile <span class="coord">('+col+', '+row+')</span> <span style="color:#666">(unmapped)</span>';
});
wrapper.addEventListener('mouseleave', function() { drawGrid(-1,-1); hoverCoord.textContent = '—'; });

function buildMapping() {
  var c = document.getElementById('mapping');
  for (var key in MAPPING) {
    var m = MAPPING[key];
    var sec = document.createElement('div'); sec.className = 'mapping-section';
    var h = document.createElement('h3'); h.style.color = m.color; h.textContent = m.label+' ('+key+')';
    sec.appendChild(h);
    var g = document.createElement('div'); g.className = 'map';
    for (var i = 0; i < m.tiles.length; i++) {
      var t = m.tiles[i], tc = t[0], tr = t[1];
      var cell = document.createElement('div'); cell.className = 'map-cell';
      var mn = document.createElement('canvas'); mn.width = 32; mn.height = 32;
      var mcx = mn.getContext('2d');
      mcx.drawImage(img, tc*TILE_SIZE, tr*TILE_SIZE, TILE_SIZE, TILE_SIZE, 0, 0, 32, 32);
      cell.appendChild(mn);
      var lb = document.createElement('div'); lb.style.cssText = 'font-size:10px;color:#999;text-align:center';
      lb.textContent = '('+tc+','+tr+')';
      cell.appendChild(lb);
      g.appendChild(cell);
    }
    sec.appendChild(g);
    c.appendChild(sec);
  }
}
img.onload = function() { drawGrid(-1,-1); buildMapping(); };
</script>
</body>
